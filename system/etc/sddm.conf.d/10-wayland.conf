# Opt-in, installed by: sudo ./install_system.sh --sddm-wayland
#
# Runs the SDDM greeter on Wayland with weston in kiosk mode (SDDM's default
# Wayland compositor, package weston) instead of Xorg. On the hybrid laptop the
# Xorg greeter keeps the NVIDIA dGPU awake and blocks D3cold.
#
# If the greeter does not come up: switch to a TTY (Ctrl+Alt+F3), then
#   sudo rm /etc/sddm.conf.d/10-wayland.conf && sudo systemctl restart sddm
[General]
DisplayServer=wayland
