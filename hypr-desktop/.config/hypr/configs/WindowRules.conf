# /* ---- 💫 https://github.com/JaKooLit 💫 ---- */ #
# Updated for Hyprland 0.53 Unified Syntax

# --- TAG DEFINITIONS ---
windowrule = tag +browser, match:class ^([Ff]irefox|org.mozilla.firefox|[Ff]irefox-esr|[Ff]irefox-bin)$
windowrule = tag +browser, match:class ^([Gg]oogle-chrome(-beta|-dev|-unstable)?)$
windowrule = tag +browser, match:class ^(chrome-.+-Default)$
windowrule = tag +browser, match:class ^([Cc]hromium)$
windowrule = tag +browser, match:class ^([Mm]icrosoft-edge(-stable|-beta|-dev|-unstable))$
windowrule = tag +browser, match:class ^(Brave-browser(-beta|-dev|-unstable)?)$
windowrule = tag +browser, match:class ^([Tt]horium-browser|[Cc]achy-browser)$
windowrule = tag +browser, match:class ^(zen-alpha|zen)$

windowrule = tag +notif, match:class ^(swaync-control-center|swaync-notification-window|swaync-client|class)$
windowrule = tag +KooL_Cheat, match:title ^(KooL Quick Cheat Sheet)$
windowrule = tag +KooL_Settings, match:title ^(KooL Hyprland Settings)$
windowrule = tag +KooL-Settings, match:class ^(nwg-displays|nwg-look)$
windowrule = tag +terminal, match:class ^(Alacritty|kitty|kitty-dropterm)$
windowrule = tag +email, match:class ^([Tt]hunderbird|org.gnome.Evolution|eu.betterbird.Betterbird)$
windowrule = tag +projects, match:class ^(codium|codium-url-handler|VSCodium|VSCode|code|code-url-handler|jetbrains-.+)$
windowrule = tag +screenshare, match:class ^(com.obsproject.Studio)$
windowrule = tag +im, match:class ^([Dd]iscord|[Ww]ebCord|[Vv]esktop|[Ff]erdium|[Ww]hatsapp-for-linux|ZapZap|com.rtosta.zapzap|org.telegram.desktop|io.github.tdesktop_x64.TDesktop|teams-for-linux|im.riot.Riot|Element)$
windowrule = tag +games, match:class ^(gamescope|steam_app_\d+)$
windowrule = tag +gamestore, match:class ^([Ss]team|com.heroicgameslauncher.hgl)$
windowrule = tag +gamestore, match:title ^([Ll]utris)$
windowrule = tag +file-manager, match:class ^([Tt]hunar|org.gnome.Nautilus|[Pp]cmanfm-qt|app.drey.Warp)$
windowrule = tag +wallpaper, match:class ^([Ww]aytrogen)$
windowrule = tag +multimedia, match:class ^([Aa]udacious)$
windowrule = tag +multimedia_video, match:class ^([Mm]pv|vlc)$

# Settings Tags
windowrule = tag +settings, match:title ^(ROG Control|Kvantum Manager)$
windowrule = tag +settings, match:class ^(wihotspot(-gui)?|[Bb]aobab|org.gnome.[Bb]aobab|gnome-disks|file-roller|org.gnome.FileRoller|nm-applet|nm-connection-editor|blueman-manager|pavucontrol|org.pulseaudio.pavucontrol|com.saivert.pwvucontrol|qt5ct|qt6ct|[Yy]ad|xdg-desktop-portal-gtk|org.kde.polkit-kde-authentication-agent-1|[Rr]ofi)$
windowrule = tag +viewer, match:class ^(gnome-system-monitor|org.gnome.SystemMonitor|io.missioncenter.MissionCenter|evince|eog|org.gnome.Loupe)$

# --- GENERAL RULES (Using tags) ---
# Note: Tags added via windowrule are "dynamic", so we match them with name*
windowrule = no_blur on, match:tag multimedia_video*
windowrule = opacity 1.0, match:tag multimedia_video*

# POSITIONING
windowrule = center on, match:tag KooL_Cheat*
windowrule = center on, match:class ([Tt]hunar), match:title negative:(.*[Tt]hunar.*)
windowrule = center on, match:title ^(ROG Control|Keybindings)$
windowrule = center on, match:tag KooL-Settings*
windowrule = center on, match:class ^(pavucontrol|org.pulseaudio.pavucontrol|com.saivert.pwvucontrol|[Ww]hatsapp-for-linux|ZapZap|com.rtosta.zapzap|[Ff]erdium)$
windowrule = move 72% 7%, match:title ^(Picture-in-Picture)$

# IDLE INHIBIT (Line 50 Fix)
windowrule = idle_inhibit fullscreen, match:fullscreen true

# FLOAT RULES
windowrule = float on, match:tag KooL_Cheat*
windowrule = float on, match:tag wallpaper*
windowrule = float on, match:tag settings*
windowrule = float on, match:tag viewer*
windowrule = float on, match:tag KooL-Settings*
windowrule = float on, match:class ([Zz]oom|onedriver|onedriver-launcher|mpv|com.github.rafostar.Clapper|^[Qq]alculate-gtk|[Ff]erdium)
windowrule = float on, match:class org.gnome.Calculator, match:title Calculator
windowrule = float on, match:title ^(Picture-in-Picture)$

# Popups and Dialogue
windowrule = float on, match:title ^(Authentication Required)$
windowrule = center on, match:title ^(Authentication Required)$
windowrule = float on, match:class (codium|VSCodium), match:title negative:(.*(codium|VSCodium).*)
windowrule = float on, match:class ^(com.heroicgameslauncher.hgl)$, match:title negative:(Heroic Games Launcher)
windowrule = float on, match:class ^([Ss]team)$, match:title negative:^([Ss]team)$
windowrule = float on, match:class ([Tt]hunar), match:title negative:(.*[Tt]hunar.*)

windowrule = float on, match:title ^(Add Folder to Workspace|Save As)$
windowrule = size 70% 60%, match:title ^(Add Folder to Workspace|Save As)$
windowrule = center on, match:title ^(Add Folder to Workspace|Save As)$

windowrule = float on, match:initial_title ^(Open Files)$
windowrule = size 70% 60%, match:initial_title ^(Open Files)$

windowrule = float on, match:title ^(SDDM Background)$
windowrule = center on, match:title ^(SDDM Background)$
windowrule = size 16% 12%, match:title ^(SDDM Background)$

# OPACITY
windowrule = opacity 0.99 0.8, match:tag browser*
windowrule = opacity 0.9 0.8, match:tag projects*
windowrule = opacity 0.94 0.86, match:tag im*
windowrule = opacity 0.94 0.86, match:tag multimedia*
windowrule = opacity 0.9 0.8, match:tag file-manager*
windowrule = opacity 0.9 0.7, match:tag terminal*
windowrule = opacity 0.8 0.7, match:tag settings*
windowrule = opacity 0.82 0.75, match:tag viewer*
windowrule = opacity 0.9 0.7, match:tag wallpaper*
windowrule = opacity 0.8 0.7, match:class ^(gedit|org.gnome.TextEditor|mousepad)$
windowrule = opacity 0.9 0.8, match:class ^(deluge|seahorse)$
windowrule = opacity 0.95 0.75, match:title ^(Picture-in-Picture)$

# PINNING & EXTRAS
windowrule = pin on, match:title ^(Picture-in-Picture)$
windowrule = keep_aspect_ratio on, match:title ^(Picture-in-Picture)$
windowrule = no_blur on, match:tag games*
windowrule = fullscreen on, match:tag games*

# FOCUS
windowrule = no_initial_focus on, match:class ^(jetbrains-.*)$
windowrule = no_initial_focus on, match:title ^(wind.*)$

# LAYER RULES (Line 111-116 Fixes)
layerrule = blur on, match:namespace rofi
layerrule = ignore_alpha 0, match:namespace rofi
layerrule = blur on, match:namespace notifications
layerrule = ignore_alpha 0, match:namespace notifications
layerrule = blur on, match:namespace quickshell:overview
layerrule = ignore_alpha 0, match:namespace quickshell:overview
layerrule = ignore_alpha 0.5, match:namespace quickshell:overview
