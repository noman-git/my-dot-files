# Commands and Apps to be executed at launch

# Sticky notes — daemon at login (respects in-app "Start on login" toggle)
exec-once = sticky --autostart

# Wallpaper daemon + resume last wallpaper state at login
# NOTE: swww/swww-daemon are symlinks -> awww/awww-daemon on this system
# WallpaperStartup.sh resumes the last shuffle pool (Dark/Light/All), or just
# restores the last manually-picked wallpaper if shuffle was off.
exec-once = swww-daemon --format xrgb
exec-once = sleep 1.5 && $HOME/.config/hypr/UserScripts/WallpaperStartup.sh

