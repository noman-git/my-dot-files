# For window rules and layerrules
# See https://wiki.hyprland.org/Configuring/Window-Rules/ for more

# This file is used to add or overwrite window rules
# This file will not be modified during dotfiles updates

# Sticky (vixalien Notes) — float + pin so notes follow you across workspaces
# Hyprland 0.48+ syntax: match:<field> <regex>, then rules
windowrule = match:class ^(sticky\.py)$, float on, pin on, opacity 0.95 0.90, no_initial_focus on
windowrule = match:class ^(sticky\.py)$ match:title ^(Notes)$, size 360 420
