# vim:fileencoding=utf-8:foldmethod=marker


shell_integration no-cursor
cursor_shape block

# background_image ~/wallpapers/850997.png   (file does not exist; set a real path to enable)
# background_image_layout cscaled
background_opacity 1.0

background_tint 0.99

font_family JetBrainsMono Nerd Font
bold_font JetBrainsMono Nerd Font Bold
italic_font JetBrainsMono Nerd Font Italic
bold_italic_font JetBrainsMono Nerd Font Bold Italic

confirm_os_window_close 0

# No title bar (traffic lights and title) on macOS; the window keeps its
# border and can still be resized. Hyprland draws no kitty title bar anyway.
# kitty applies this only at start, not on a config reload.
hide_window_decorations titlebar-only

# macOS: fullscreen stays on the current Space, so OmniWM keeps managing it.
# Linux ignores this option.
macos_traditional_fullscreen yes
