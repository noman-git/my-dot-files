; cava for the bar: 8 bars as text to stdout, 0-7 per bar, for
; plugins/cava_bar.sh. Hammerspoon runs it; Hammerspoon needs "System Audio
; Recording Only" in Privacy & Security for the Core Audio tap.

[general]
framerate = 20
bars = 8
sleep_timer = 3

[input]
method = coreaudio
source = tap

[output]
method = raw
raw_target = /dev/stdout
data_format = ascii
ascii_max_range = 7
bar_delimiter = 59
frame_delimiter = 10

[smoothing]
noise_reduction = 70
